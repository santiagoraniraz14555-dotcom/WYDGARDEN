<!-- Carrito dinámico -->
<div class="main-content">
  <div class="card">
    <h3>Carrito de Compras</h3>
    <table style="width: 100%; text-align: center;">
  <thead>
    <tr>
      <th>Producto</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Subtotal</th>
      <th>Acciones</th> <!-- Esta columna es nueva -->
    </tr>
  </thead>
  <tbody id="carrito-body">
    <!-- Rellenado con JS -->
  </tbody>
  <tfoot>
    <tr>
      <td colspan="4" style="text-align: right;"><strong>Total:</strong></td>
      <td><strong id="total">$0</strong></td>
    </tr>
  </tfoot>
</table>
    <br>
    <button class="btn btn-success">Finalizar Compra</button>
  </div>
</div>
</div>
</div>

<script>
  const tbody = document.getElementById("carrito-body");
  const total = document.getElementById("total");

  function cargarCarrito() {
    const carrito = JSON.parse(localStorage.getItem("carrito")) || {};
    tbody.innerHTML = "";
    let totalGeneral = 0;

    for (const nombre in carrito) {
      const { precio, cantidad } = carrito[nombre];
      const subtotal = precio * cantidad;
      totalGeneral += subtotal;

      const fila = `
        <tr>
          <td>${nombre}</td>
          <td>
            <button onclick="modificarCantidad('${nombre}', -1)">-</button>
            ${cantidad}
            <button onclick="modificarCantidad('${nombre}', 1)">+</button>
          </td>
          <td>$${precio.toLocaleString()}</td>
          <td>$${subtotal.toLocaleString()}</td>
          <td><button onclick="eliminarProducto('${nombre}')">Eliminar</button></td>
        </tr>
      `;
      tbody.innerHTML += fila;
    }

    total.textContent = `$${totalGeneral.toLocaleString()}`;
  }

  function modificarCantidad(nombre, cambio) {
    const carrito = JSON.parse(localStorage.getItem("carrito")) || {};

    if (carrito[nombre]) {
      carrito[nombre].cantidad += cambio;

      if (carrito[nombre].cantidad <= 0) {
        delete carrito[nombre];
      }

      localStorage.setItem("carrito", JSON.stringify(carrito));
      cargarCarrito();
    }
  }

  function eliminarProducto(nombre) {
    const carrito = JSON.parse(localStorage.getItem("carrito")) || {};
    delete carrito[nombre];
    localStorage.setItem("carrito", JSON.stringify(carrito));
    cargarCarrito();
  }

  // Cargar al iniciar
  cargarCarrito();
</script>
