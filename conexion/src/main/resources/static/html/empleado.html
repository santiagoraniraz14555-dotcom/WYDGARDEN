              <div class="container">
    <h2>Formulario Cliente</h2>
    <form id="employeeForm" onsubmit="return validateForm(event)">
        <label for="firstName">Nombre</label>
        <input type="text" id="firstName" name="firstName" placeholder="Ingresa tu nombre" required minlength="3" required maxlength="100" />
        <div class="error" id="firstNameError"></div>

        <label for="lastName">Apellido</label>
        <input type="text" id="lastName" name="lastName" placeholder="Ingresa tu apellido" required minlength="3" required maxlength="100" />
        <div class="error" id="lastNameError"></div>

        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" name="phone" placeholder="123 4567890" required maxlength="10" />
        <div class="error" id="phoneError"></div>

        <label for="perfil">Perfil</label>
        <input type="text" id="perfil" name="perfil" placeholder="Experiencia" required minlength="5" required maxlength="100" />
        <div class="error" id="perfilError"></div>


        <button type="submit">Enviar Formulario</button>
        <div class="success" id="successMessage"></div>
    </form>
<center>
    <h3>Lista de Empleados</h3>
    <table id="clientTable" border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Teléfono</th>
                <th>Perfil</th>
