<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="main-header">
    <div class="contenedor">
      <nav class="barra-navegacion">
        <a href="index.html" class="inicio">
          <img src="img/logo.ico" alt="Logo WYDGARDEN" />
        </a>
      </nav>
    </div>
  </header>

  <!-- FORMULARIO -->
  <form>
    <h2>Bienvenido.</h2>
    <p>Inicia Sesión</p>

    <div class="input-wrapper">
      <input type="email" name="email" id="email" placeholder="Email" required />
      <img class="input-icon" src="img/email.svg" alt="Icono email" />
    </div>

    <div class="input-wrapper">
      <input type="password" name="password" id="password" placeholder="Contraseña" required />
      <img class="input-icon" src="img/password.svg" alt="Icono contraseña" />
    </div>

    <input class="btn" type="submit" value="Enviar" />
    <a href="cliente.html">Si no tienes una cuenta puedes registrarte</a>
    <a href="500.html">¿No se completa tu acción?.</a>
  </form>
</body>
</html>
